<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DFS、BFS 与网格搜索示意图</title>
  <desc id="desc">标注 DFS 深度优先、BFS 层次优先和迷宫搜索中的起点、终点、障碍、已访问。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .node { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .node2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .edge { stroke: #94a3b8; stroke-width: 5; }
      .path { stroke: #dc2626; stroke-width: 6; fill: none; marker-end: url(#arrow-red); }
      .bfs { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .wall { fill: #334155; }
      .open { fill: #e2e8f0; stroke: #cbd5e1; }
      .seen { fill: #bfdbfe; stroke: #60a5fa; }
      .goal { fill: #fee2e2; stroke: #dc2626; }
      .start { fill: #dcfce7; stroke: #16a34a; }
      .title { font: 700 42px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 700 30px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 500 22px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 500 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .num { font: 700 23px "SFMono-Regular", Consolas, monospace; fill: #1e293b; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="80" y="82">搜索算法：DFS 深入一条路，BFS 一层层扩展</text>
  <text class="small" x="80" y="122">核心是状态、可走方向、visited 标记、终止条件。</text>

  <rect class="card" x="80" y="170" width="600" height="330" rx="28"/>
  <text class="label" x="125" y="230">图搜索对比</text>
  <line class="edge" x1="210" y1="330" x2="330" y2="270"/>
  <line class="edge" x1="330" y1="270" x2="460" y2="330"/>
  <line class="edge" x1="330" y1="270" x2="330" y2="420"/>
  <line class="edge" x1="460" y1="330" x2="560" y2="420"/>
  <circle class="node" cx="210" cy="330" r="42"/><text class="num" x="210" y="338" text-anchor="middle">A</text>
  <circle class="node" cx="330" cy="270" r="42"/><text class="num" x="330" y="278" text-anchor="middle">B</text>
  <circle class="node" cx="460" cy="330" r="42"/><text class="num" x="460" y="338" text-anchor="middle">C</text>
  <circle class="node" cx="330" cy="420" r="42"/><text class="num" x="330" y="428" text-anchor="middle">D</text>
  <circle class="node" cx="560" cy="420" r="42"/><text class="num" x="560" y="428" text-anchor="middle">E</text>
  <path class="path" d="M 210 330 L 330 270 L 330 420"/>
  <text class="small" x="125" y="470">DFS：沿一条分支深入，走不通再回溯。</text>

  <rect class="card" x="720" y="170" width="600" height="330" rx="28"/>
  <text class="label" x="765" y="230">BFS 层次扩展</text>
  <g transform="translate(795,285)">
    <rect class="bfs" x="0" y="0" width="120" height="82" rx="16"/><text class="num" x="60" y="50" text-anchor="middle">起点</text>
    <rect class="bfs" x="170" y="-55" width="120" height="82" rx="16"/><text class="num" x="230" y="-5" text-anchor="middle">第1层</text>
    <rect class="bfs" x="170" y="55" width="120" height="82" rx="16"/><text class="num" x="230" y="105" text-anchor="middle">第1层</text>
    <rect class="bfs" x="340" y="-55" width="120" height="82" rx="16"/><text class="num" x="400" y="-5" text-anchor="middle">第2层</text>
    <rect class="bfs" x="340" y="55" width="120" height="82" rx="16"/><text class="num" x="400" y="105" text-anchor="middle">第2层</text>
    <line class="edge" x1="120" y1="41" x2="170" y2="-14"/>
    <line class="edge" x1="120" y1="41" x2="170" y2="96"/>
    <line class="edge" x1="290" y1="-14" x2="340" y2="-14"/>
    <line class="edge" x1="290" y1="96" x2="340" y2="96"/>
  </g>
  <text class="small" x="765" y="470">BFS：用队列保存下一层，可求无权最短路。</text>

  <rect class="card" x="80" y="550" width="1240" height="250" rx="28"/>
  <text class="label" x="125" y="610">迷宫 / Flood Fill 中的状态标记</text>
  <g transform="translate(450,605)">
    <rect class="start" x="0" y="0" width="58" height="58" rx="8"/><text class="num" x="29" y="38" text-anchor="middle">S</text>
    <rect class="seen" x="68" y="0" width="58" height="58" rx="8"/>
    <rect class="seen" x="136" y="0" width="58" height="58" rx="8"/>
    <rect class="wall" x="204" y="0" width="58" height="58" rx="8"/>
    <rect class="open" x="272" y="0" width="58" height="58" rx="8"/>
    <rect class="open" x="0" y="68" width="58" height="58" rx="8"/>
    <rect class="wall" x="68" y="68" width="58" height="58" rx="8"/>
    <rect class="seen" x="136" y="68" width="58" height="58" rx="8"/>
    <rect class="seen" x="204" y="68" width="58" height="58" rx="8"/>
    <rect class="goal" x="272" y="68" width="58" height="58" rx="8"/><text class="num" x="301" y="106" text-anchor="middle">T</text>
  </g>
  <g transform="translate(860,625)">
    <rect class="start" x="0" y="0" width="34" height="34" rx="6"/><text class="tiny" x="48" y="24">起点</text>
    <rect class="goal" x="0" y="48" width="34" height="34" rx="6"/><text class="tiny" x="48" y="72">终点</text>
    <rect class="seen" x="150" y="0" width="34" height="34" rx="6"/><text class="tiny" x="198" y="24">已访问</text>
    <rect class="wall" x="150" y="48" width="34" height="34" rx="6"/><text class="tiny" x="198" y="72">障碍</text>
  </g>
  <text class="small" x="125" y="755">写代码时每一步都问：当前位置是否合法？是否访问过？是否到达目标？</text>
</svg>
