<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">DFS、BFS 与 Flood Fill 搜索示意图</title>
  <desc id="desc">展示 DFS 深入一条路径、BFS 按层扩展、Flood Fill 在网格中寻找连通块。</desc>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .title { font: 800 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .node { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .node2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .edge { stroke: #94a3b8; stroke-width: 5; }
      .path { stroke: #dc2626; stroke-width: 6; fill: none; marker-end: url(#arrow-red); }
      .bfs { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .wall { fill: #334155; }
      .seen { fill: #bae6fd; stroke: #0284c7; stroke-width: 3; }
      .start { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .tip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="50" width="1280" height="800" rx="32"/>
  <text class="title" x="120" y="130">搜索：DFS、BFS 与 Flood Fill</text>
  <text class="subtitle" x="120" y="172">DFS 走到底再回退，BFS 一层层扩展，Flood Fill 找整块连通区域。</text>

  <g transform="translate(120 225)">
    <rect class="card" x="0" y="0" width="560" height="260" rx="28"/>
    <text class="label" x="34" y="52">DFS：沿一条路深入</text>
    <line class="edge" x1="110" y1="118" x2="235" y2="78"/>
    <line class="edge" x1="110" y1="118" x2="235" y2="158"/>
    <line class="edge" x1="235" y1="78" x2="360" y2="78"/>
    <line class="edge" x1="235" y1="158" x2="360" y2="198"/>
    <circle class="node" cx="110" cy="118" r="32"/><text class="small" x="110" y="125" text-anchor="middle">A</text>
    <circle class="node" cx="235" cy="78" r="32"/><text class="small" x="235" y="85" text-anchor="middle">B</text>
    <circle class="node" cx="235" cy="158" r="32"/><text class="small" x="235" y="165" text-anchor="middle">C</text>
    <circle class="node" cx="360" cy="78" r="32"/><text class="small" x="360" y="85" text-anchor="middle">D</text>
    <circle class="node" cx="360" cy="198" r="32"/><text class="small" x="360" y="205" text-anchor="middle">E</text>
    <path class="path" d="M110 118 L235 78 L360 78"/>
    <text class="small" x="110" y="232">先 A → B → D，走不通再回退。</text>

    <rect class="card" x="640" y="0" width="560" height="260" rx="28"/>
    <text class="label" x="674" y="52">BFS：按层扩展</text>
    <g transform="translate(700 105)">
      <rect class="bfs" x="0" y="30" width="110" height="70" rx="14"/><text class="small" x="55" y="73" text-anchor="middle">起点</text>
      <rect class="bfs" x="150" y="0" width="110" height="70" rx="14"/><text class="small" x="205" y="43" text-anchor="middle">第1层</text>
      <rect class="bfs" x="150" y="90" width="110" height="70" rx="14"/><text class="small" x="205" y="133" text-anchor="middle">第1层</text>
      <rect class="bfs" x="300" y="0" width="110" height="70" rx="14"/><text class="small" x="355" y="43" text-anchor="middle">第2层</text>
      <rect class="bfs" x="300" y="90" width="110" height="70" rx="14"/><text class="small" x="355" y="133" text-anchor="middle">第2层</text>
    </g>
    <text class="small" x="760" y="232">第一次到终点，就是无权最短路。</text>
  </g>

  <g transform="translate(120 550)">
    <rect class="card" x="0" y="0" width="1200" height="230" rx="28"/>
    <text class="label" x="34" y="52">Flood Fill：网格连通块</text>
    <g transform="translate(60 82)">
      <rect class="start" x="0" y="0" width="52" height="52" rx="8"/><text class="small" x="26" y="34" text-anchor="middle">S</text>
      <rect class="seen" x="62" y="0" width="52" height="52" rx="8"/>
      <rect class="wall" x="124" y="0" width="52" height="52" rx="8"/>
      <rect class="seen" x="186" y="0" width="52" height="52" rx="8"/>
      <rect class="seen" x="0" y="62" width="52" height="52" rx="8"/>
      <rect class="seen" x="62" y="62" width="52" height="52" rx="8"/>
      <rect class="wall" x="124" y="62" width="52" height="52" rx="8"/>
      <rect class="seen" x="186" y="62" width="52" height="52" rx="8"/>
      <rect class="wall" x="0" y="124" width="52" height="52" rx="8"/>
      <rect class="seen" x="62" y="124" width="52" height="52" rx="8"/>
      <rect class="seen" x="124" y="124" width="52" height="52" rx="8"/>
      <rect class="seen" x="186" y="124" width="52" height="52" rx="8"/>
    </g>
    <text class="subtitle" x="430" y="105">从一个起点出发，找到所有上下左右连通的可走格子。</text>
    <text class="small" x="430" y="150">蓝色：已经访问的同一区域；深色：障碍。</text>
    <text class="small" x="430" y="190">外层双循环找起点，搜索函数负责“吃掉”整个连通块。</text>
  </g>

  <rect class="tip" x="240" y="812" width="920" height="50" rx="18"/>
  <text class="subtitle" x="700" y="844" text-anchor="middle">选择方法：所有方案用 DFS，最短步数用 BFS，数区域用 Flood Fill。</text>
</svg>
