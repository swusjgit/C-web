<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">计算机系统基本构成示意图</title>
  <desc id="desc">展示输入设备、CPU、内存、硬盘、输出设备之间的数据流动关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 3; }
      .title { font: 800 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .code { font: 800 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .arrow { fill: none; stroke: #475569; stroke-width: 6; marker-end: url(#arrow); }
      .io { fill: #fce7f3; stroke: #db2777; stroke-width: 4; }
      .cpu { fill: #dbeafe; stroke: #2563eb; stroke-width: 4; }
      .ram { fill: #dcfce7; stroke: #16a34a; stroke-width: 4; }
      .disk { fill: #fef3c7; stroke: #d97706; stroke-width: 4; }
      .tip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="50" width="1280" height="800" rx="32" filter="url(#shadow)"/>

  <text class="title" x="120" y="130">计算机的基本构成</text>
  <text class="subtitle" x="120" y="172">程序运行时：CPU 负责计算，内存保存正在使用的数据，硬盘长期保存文件。</text>

  <g transform="translate(120 285)">
    <rect class="io" x="0" y="0" width="210" height="130" rx="24"/>
    <text class="label" x="105" y="54" text-anchor="middle">输入设备</text>
    <text class="small" x="105" y="92" text-anchor="middle">键盘 / 鼠标</text>

    <path class="arrow" d="M235 65 H335"/>

    <rect class="cpu" x="360" y="-25" width="310" height="180" rx="28"/>
    <text class="label" x="515" y="44" text-anchor="middle">CPU</text>
    <text class="small" x="515" y="84" text-anchor="middle">执行指令、完成计算</text>
    <rect x="420" y="105" width="110" height="42" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="code" x="475" y="132" text-anchor="middle">ALU</text>
    <rect x="545" y="105" width="110" height="42" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="code" x="600" y="132" text-anchor="middle">控制器</text>

    <path class="arrow" d="M695 65 H795"/>

    <rect class="io" x="820" y="0" width="210" height="130" rx="24"/>
    <text class="label" x="925" y="54" text-anchor="middle">输出设备</text>
    <text class="small" x="925" y="92" text-anchor="middle">显示器 / 打印机</text>
  </g>

  <g transform="translate(410 535)">
    <rect class="ram" x="0" y="0" width="330" height="130" rx="24"/>
    <text class="label" x="165" y="52" text-anchor="middle">内存 RAM</text>
    <text class="small" x="165" y="92" text-anchor="middle">临时保存运行中的程序</text>

    <rect class="disk" x="500" y="0" width="330" height="130" rx="24"/>
    <text class="label" x="665" y="52" text-anchor="middle">硬盘</text>
    <text class="small" x="665" y="92" text-anchor="middle">长期保存 .cpp 和文件</text>

    <path class="arrow" d="M360 65 H475"/>
  </g>

  <path class="arrow" d="M585 455 V515"/>
  <path class="arrow" d="M1075 535 C1075 460 720 460 665 455"/>

  <rect class="tip" x="220" y="760" width="960" height="58" rx="20"/>
  <text class="subtitle" x="700" y="797" text-anchor="middle">CSP-J 重点：分清“正在运行的内存”和“长期保存的硬盘”。</text>
</svg>
