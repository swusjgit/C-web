<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">栈和队列操作示意图</title>
  <desc id="desc">展示栈的后进先出和队列的先进先出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 3; }
      .title { font: 800 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 800 32px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .code { font: 800 28px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .stack { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .queue { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .arrow { fill: none; stroke: #475569; stroke-width: 6; marker-end: url(#arrow); }
      .tip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="50" width="1280" height="800" rx="32"/>
  <text class="title" x="120" y="130">栈与队列</text>
  <text class="subtitle" x="120" y="172">栈是后进先出，队列是先进先出。先把“从哪边进、从哪边出”看清楚。</text>

  <g transform="translate(120 235)">
    <rect class="card" x="0" y="0" width="560" height="500" rx="28"/>
    <text class="label" x="40" y="58">栈 stack</text>
    <text class="small" x="40" y="96">只能从栈顶压入和弹出</text>
    <path class="arrow" d="M410 105 V170"/>
    <text class="small" x="410" y="92" text-anchor="middle">push / pop</text>
    <g transform="translate(150 170)">
      <rect class="stack" x="0" y="0" width="260" height="76" rx="14"/><text class="code" x="130" y="49" text-anchor="middle">3  top</text>
      <rect class="stack" x="0" y="90" width="260" height="76" rx="14"/><text class="code" x="130" y="139" text-anchor="middle">2</text>
      <rect class="stack" x="0" y="180" width="260" height="76" rx="14"/><text class="code" x="130" y="229" text-anchor="middle">1  bottom</text>
    </g>
    <text class="small" x="280" y="455" text-anchor="middle">最后放进去的 3 最先出来</text>

    <rect class="card" x="640" y="0" width="560" height="500" rx="28"/>
    <text class="label" x="680" y="58">队列 queue</text>
    <text class="small" x="680" y="96">从队尾进入，从队首离开</text>
    <g transform="translate(700 205)">
      <rect class="queue" x="0" y="0" width="110" height="96" rx="14"/><text class="code" x="55" y="58" text-anchor="middle">1</text><text class="small" x="55" y="130" text-anchor="middle">front</text>
      <rect class="queue" x="140" y="0" width="110" height="96" rx="14"/><text class="code" x="195" y="58" text-anchor="middle">2</text>
      <rect class="queue" x="280" y="0" width="110" height="96" rx="14"/><text class="code" x="335" y="58" text-anchor="middle">3</text><text class="small" x="335" y="130" text-anchor="middle">back</text>
    </g>
    <path class="arrow" d="M685 253 H735"/>
    <text class="small" x="670" y="238" text-anchor="middle">pop</text>
    <path class="arrow" d="M1110 253 H1170"/>
    <text class="small" x="1135" y="238" text-anchor="middle">push</text>
    <text class="small" x="920" y="455" text-anchor="middle">最早进入的 1 最先出来</text>
  </g>

  <rect class="tip" x="230" y="782" width="940" height="58" rx="20"/>
  <text class="subtitle" x="700" y="819" text-anchor="middle">CSP-J 易错：stack 看 top，queue 看 front 和 back。</text>
</svg>
