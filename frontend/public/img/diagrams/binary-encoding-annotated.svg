<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">二进制、字节与 ASCII 编码示意图</title>
  <desc id="desc">展示 bit、Byte、二进制权值和 ASCII 字符编码之间的关系。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 3; }
      .title { font: 800 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .code { font: 800 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .bit0 { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 3; }
      .bit1 { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .tip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="50" width="1280" height="800" rx="32"/>

  <text class="title" x="120" y="130">二进制、字节与编码</text>
  <text class="subtitle" x="120" y="172">计算机内部只有 0 和 1，字符、数字和图片都要编码成二进制。</text>

  <g transform="translate(120 235)">
    <rect class="card" x="0" y="0" width="1160" height="190" rx="28"/>
    <text class="label" x="42" y="58">1 Byte = 8 bit</text>
    <g transform="translate(42 88)">
      <rect class="bit0" x="0" y="0" width="82" height="82" rx="16"/><text class="code" x="41" y="53" text-anchor="middle">0</text>
      <rect class="bit1" x="100" y="0" width="82" height="82" rx="16"/><text class="code" x="141" y="53" text-anchor="middle">1</text>
      <rect class="bit1" x="200" y="0" width="82" height="82" rx="16"/><text class="code" x="241" y="53" text-anchor="middle">1</text>
      <rect class="bit0" x="300" y="0" width="82" height="82" rx="16"/><text class="code" x="341" y="53" text-anchor="middle">0</text>
      <rect class="bit0" x="400" y="0" width="82" height="82" rx="16"/><text class="code" x="441" y="53" text-anchor="middle">0</text>
      <rect class="bit0" x="500" y="0" width="82" height="82" rx="16"/><text class="code" x="541" y="53" text-anchor="middle">0</text>
      <rect class="bit0" x="600" y="0" width="82" height="82" rx="16"/><text class="code" x="641" y="53" text-anchor="middle">0</text>
      <rect class="bit1" x="700" y="0" width="82" height="82" rx="16"/><text class="code" x="741" y="53" text-anchor="middle">1</text>
    </g>
    <text class="small" x="920" y="122" text-anchor="middle">一个字节可以表示 256 种状态</text>
  </g>

  <g transform="translate(120 480)">
    <rect class="card" x="0" y="0" width="560" height="250" rx="28"/>
    <text class="label" x="40" y="58">二进制转十进制</text>
    <text class="code" x="40" y="112">1011₂ = 1×8 + 0×4 + 1×2 + 1×1</text>
    <text class="code" x="40" y="168">= 11₁₀</text>
    <text class="small" x="40" y="214">每一位的权值从右往左依次是 1、2、4、8...</text>

    <rect class="card" x="640" y="0" width="520" height="250" rx="28"/>
    <text class="label" x="680" y="58">ASCII 字符编码</text>
    <text class="code" x="680" y="112">'A' = 65</text>
    <text class="code" x="680" y="158">'0' = 48</text>
    <text class="code" x="680" y="204">int x = c - '0';</text>
  </g>

  <rect class="tip" x="250" y="782" width="900" height="58" rx="20"/>
  <text class="subtitle" x="700" y="819" text-anchor="middle">CSP-J 常考：字符 '0' 和整数 0 不是同一个值。</text>
</svg>
