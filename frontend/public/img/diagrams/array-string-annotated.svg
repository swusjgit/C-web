<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">数组、二维数组与字符串示意图</title>
  <desc id="desc">展示一维数组下标、二维数组行列关系，以及字符数组和字符串结束符。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ef; stroke-width: 3; }
      .title { font: 800 46px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .code { font: 800 25px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .cell { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .matrix { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
      .str { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .tip { fill: #eff6ff; stroke: #93c5fd; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <rect class="panel" x="60" y="50" width="1280" height="800" rx="32"/>
  <text class="title" x="120" y="130">数组、二维数组与字符串</text>
  <text class="subtitle" x="120" y="172">数组靠下标定位，字符串本质上也是一串连续字符。</text>

  <g transform="translate(120 230)">
    <rect class="card" x="0" y="0" width="1160" height="180" rx="28"/>
    <text class="label" x="40" y="56">一维数组：下标从 0 开始</text>
    <g transform="translate(40 88)">
      <rect class="cell" x="0" y="0" width="120" height="66" rx="12"/><text class="code" x="60" y="42" text-anchor="middle">12</text><text class="small" x="60" y="98" text-anchor="middle">a[0]</text>
      <rect class="cell" x="145" y="0" width="120" height="66" rx="12"/><text class="code" x="205" y="42" text-anchor="middle">8</text><text class="small" x="205" y="98" text-anchor="middle">a[1]</text>
      <rect class="cell" x="290" y="0" width="120" height="66" rx="12"/><text class="code" x="350" y="42" text-anchor="middle">31</text><text class="small" x="350" y="98" text-anchor="middle">a[2]</text>
      <rect class="cell" x="435" y="0" width="120" height="66" rx="12"/><text class="code" x="495" y="42" text-anchor="middle">4</text><text class="small" x="495" y="98" text-anchor="middle">a[3]</text>
      <rect class="cell" x="580" y="0" width="120" height="66" rx="12"/><text class="code" x="640" y="42" text-anchor="middle">19</text><text class="small" x="640" y="98" text-anchor="middle">a[4]</text>
    </g>
    <text class="small" x="900" y="116" text-anchor="middle">长度为 5 的数组，合法下标是 0 到 4。</text>
  </g>

  <g transform="translate(120 465)">
    <rect class="card" x="0" y="0" width="560" height="270" rx="28"/>
    <text class="label" x="40" y="56">二维数组：行和列</text>
    <g transform="translate(70 95)">
      <rect class="matrix" x="0" y="0" width="82" height="54" rx="8"/><text class="code" x="41" y="36" text-anchor="middle">1</text>
      <rect class="matrix" x="94" y="0" width="82" height="54" rx="8"/><text class="code" x="135" y="36" text-anchor="middle">2</text>
      <rect class="matrix" x="188" y="0" width="82" height="54" rx="8"/><text class="code" x="229" y="36" text-anchor="middle">3</text>
      <rect class="matrix" x="0" y="66" width="82" height="54" rx="8"/><text class="code" x="41" y="102" text-anchor="middle">4</text>
      <rect class="matrix" x="94" y="66" width="82" height="54" rx="8"/><text class="code" x="135" y="102" text-anchor="middle">5</text>
      <rect class="matrix" x="188" y="66" width="82" height="54" rx="8"/><text class="code" x="229" y="102" text-anchor="middle">6</text>
      <rect class="matrix" x="0" y="132" width="82" height="54" rx="8"/><text class="code" x="41" y="168" text-anchor="middle">7</text>
      <rect class="matrix" x="94" y="132" width="82" height="54" rx="8"/><text class="code" x="135" y="168" text-anchor="middle">8</text>
      <rect class="matrix" x="188" y="132" width="82" height="54" rx="8"/><text class="code" x="229" y="168" text-anchor="middle">9</text>
    </g>
    <text class="small" x="380" y="142" text-anchor="middle">a[行][列]</text>
    <text class="small" x="380" y="176" text-anchor="middle">先行后列</text>

    <rect class="card" x="640" y="0" width="520" height="270" rx="28"/>
    <text class="label" x="680" y="56">字符数组与 string</text>
    <g transform="translate(680 105)">
      <rect class="str" x="0" y="0" width="70" height="60" rx="10"/><text class="code" x="35" y="39" text-anchor="middle">C</text>
      <rect class="str" x="82" y="0" width="70" height="60" rx="10"/><text class="code" x="117" y="39" text-anchor="middle">S</text>
      <rect class="str" x="164" y="0" width="70" height="60" rx="10"/><text class="code" x="199" y="39" text-anchor="middle">P</text>
      <rect class="str" x="246" y="0" width="70" height="60" rx="10"/><text class="code" x="281" y="39" text-anchor="middle">\0</text>
    </g>
    <text class="small" x="680" y="198">字符数组需要结束符 \0；string 会自动管理长度。</text>
  </g>

  <rect class="tip" x="250" y="782" width="900" height="58" rx="20"/>
  <text class="subtitle" x="700" y="819" text-anchor="middle">CSP-J 易错：数组长度为 n，最后一个下标是 n-1。</text>
</svg>
